<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101a22">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; media-src blob:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>音棚 — MP3プレイヤー</title>
  <link rel="icon" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body data-view="library">
  <header class="top">
    <div class="brand">
      <img src="icon-192.png" width="40" height="40" alt="">
      <h1>音棚</h1>
    </div>
    <span class="app-type">MP3プレイヤー</span>
  </header>
  <nav class="tabs" aria-label="画面の切り替え">
    <button type="button" id="library-tab" aria-pressed="true" aria-controls="library">曲一覧</button>
    <button type="button" id="player-tab" aria-pressed="false" aria-controls="player">再生画面</button>
  </nav>
  <main>
    <section id="library" class="panel" aria-labelledby="library-title">
      <div class="panel-heading">
        <div>
          <h2 id="library-title">曲一覧</h2>
          <p id="track-count" class="muted">0 曲</p>
        </div>
        <label class="import">
          <span aria-hidden="true">＋</span> MP3を追加
          <input id="file-picker" type="file" accept=".mp3,audio/mpeg" multiple aria-label="MP3を追加">
        </label>
      </div>
      <p id="library-message" class="feedback" role="status"></p>
      <div id="empty-library" class="empty">
        <span class="empty-note" aria-hidden="true">♫</span>
        <p>曲がありません</p>
        <span class="muted">「MP3を追加」から曲を選んでください。</span>
      </div>
      <ol id="tracks" class="tracks" aria-label="取り込んだ曲"></ol>
      <p class="library-foot muted">この版の曲は、ページを閉じたり更新したりすると一覧から消えます。</p>
    </section>
    <section id="player" class="panel" aria-labelledby="player-title">
      <h2 id="player-title">再生画面</h2>
      <div class="cover" aria-hidden="true">
        <div class="disc"><span>♫</span></div>
      </div>
      <p id="now-playing" class="song-title" aria-live="polite">曲を選んでください</p>
      <p id="position-in-list" class="muted position"></p>
      <input id="seek" type="range" aria-label="再生位置" min="0" max="1" step="any" value="0" disabled>
      <div class="times"><span id="elapsed">0:00</span><span id="duration">0:00</span></div>
      <div class="transport">
        <button type="button" id="previous" aria-label="前の曲" disabled>◀<span aria-hidden="true"> 前へ</span></button>
        <button type="button" id="toggle" class="play" aria-label="再生" disabled><span aria-hidden="true">▶</span></button>
        <button type="button" id="next" aria-label="次の曲" disabled><span aria-hidden="true">次へ </span>▶</button>
      </div>
      <p id="player-message" class="feedback player-feedback" role="status"></p>
      <audio id="audio" preload="metadata"></audio>
    </section>
  </main>
</body>
</html>
